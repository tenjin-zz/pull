<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement - Concours Pull de Noël</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a0a0a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h1 { color: #ff6b6b; text-align: center; }
        .subtitle { text-align: center; color: #ffd93d; margin-bottom: 30px; }
        .pull-card { background: #2d1515; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .pull-card:hover { background: #3d1f1f; }
        .rank { font-size: 1.5rem; font-weight: bold; color: #ffd93d; width: 40px; }
        .info { flex: 1; margin-left: 12px; }
        .name { font-weight: bold; font-size: 1.1rem; }
        .owner { color: #aaa; font-size: 0.9rem; }
        .votes { font-size: 1.3rem; color: #4ecdc4; font-weight: bold; }
        a { color: inherit; text-decoration: none; }
        .medal { font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎄 Concours Pull de Noël</h1>
        <div class="subtitle">Classement en direct — 50 pulls en compétition</div>
        {% for pull in pulls %}
        <a href="/?id={{ pull.id }}">
            <div class="pull-card">
                <div class="rank">
                    {% if loop.index == 1 %}🥇
                    {% elif loop.index == 2 %}🥈
                    {% elif loop.index == 3 %}🥉
                    {% else %}{{ loop.index }}
                    {% endif %}
                </div>
                <div class="info">
                    <div class="name">{{ pull.name }}</div>
                    <div class="owner">{{ pull.owner }}</div>
                </div>
                <div class="votes">{{ pull.votes }}</div>
            </div>
        </a>
        {% endfor %}
    </div>
</body>
</html>
