<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ pull.name }} - Concours Pull de Noël</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #1a0a0a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #2d1515; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        h1 { color: #ff6b6b; margin-top: 0; font-size: 1.8rem; }
        .owner { color: #ffd93d; font-size: 1.1rem; margin-bottom: 8px; }
        .desc { color: #ccc; margin-bottom: 20px; }
        .votes { font-size: 2.5rem; font-weight: bold; color: #4ecdc4; margin: 20px 0; }
        button { background: #ff6b6b; color: white; border: none; padding: 16px 32px; font-size: 1.2rem; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #ff5252; }
        button:disabled { background: #666; cursor: not-allowed; }
        a { color: #4ecdc4; text-decoration: none; }
        .back { display: inline-block; margin-bottom: 16px; }
        .qr-note { font-size: 0.85rem; color: #888; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Classement</a>
        <h1>{{ pull.name }}</h1>
        <div class="owner">{{ pull.owner }}</div>
        <div class="desc">{{ pull.description }}</div>
        <div class="votes" id="votes">{{ pull.votes }} vote{{ 's' if pull.votes != 1 else '' }}</div>
        <button id="voteBtn" onclick="vote()">Voter pour ce pull 🎄</button>
        <div class="qr-note">Scanne le QR code collé sur le pull pour arriver ici</div>
    </div>
    <script>
        async function vote() {
            const btn = document.getElementById('voteBtn');
            btn.disabled = true;
            btn.textContent = 'Vote enregistré !';
            const res = await fetch('/vote/{{ pull.id }}', { method: 'POST' });
            const data = await res.json();
            if (data.success) {
                document.getElementById('votes').textContent = data.votes + ' vote' + (data.votes !== 1 ? 's' : '');
            }
        }
    </script>
</body>
</html>
